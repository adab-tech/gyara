[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gyara"
version = "0.1.0"
description = "Developer toolkit for Hausa text: orthography, numbers, syllables, tone, and dataset QA."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ADAB-TECH Labs" }]
keywords = ["hausa", "nlp", "orthography", "african-languages", "tts"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "hypothesis", "ruff", "mypy", "build", "twine"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
gyara = "gyara.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gyara"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP035", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
